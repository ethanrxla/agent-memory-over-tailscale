services:
  agent-memory:
    build: .
    container_name: agent-memory
    environment:
      AGENT_MEMORY_DB_PATH: /data/agent_memory.db
      AGENT_MEMORY_SHARED_KEY: ${AGENT_MEMORY_SHARED_KEY:-}
      # Optional NVIDIA NIM credentials. Without them the hub runs keyword-only
      # retrieval and extractive summaries -- fully functional, just not semantic.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AGENT_MEMORY_EMBED_MODEL: ${AGENT_MEMORY_EMBED_MODEL:-nvidia/nemotron-3-embed-1b}
      AGENT_MEMORY_SUMMARY_MODEL: ${AGENT_MEMORY_SUMMARY_MODEL:-nvidia/nvidia-nemotron-nano-9b-v2}
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    restart: unless-stopped
